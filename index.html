<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <script>
      (function () {
        var productionHost = "clientfoodrush.vercel.app";
        var host = window.location.hostname;
        var isClientFoodRushPreview =
          host !== productionHost &&
          host.indexOf("clientfoodrush-") === 0 &&
          host.lastIndexOf(".vercel.app") === host.length - ".vercel.app".length;

        if (isClientFoodRushPreview) {
          window.location.replace(
            "https://" + productionHost + window.location.pathname + window.location.search + window.location.hash
          );
        }
      })();
    </script>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = 'red';
        div.style.color = 'white';
        div.style.padding = '20px';
        div.style.zIndex = '99999';
        div.innerText = 'CRASH: ' + msg + ' at ' + url + ':' + line;
        document.body.appendChild(div);
      };
      window.onunhandledrejection = function(event) {
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.bottom = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.backgroundColor = 'orange';
        div.style.color = 'black';
        div.style.padding = '20px';
        div.style.zIndex = '99999';
        div.innerText = 'PROMISE REJECTED: ' + event.reason;
        document.body.appendChild(div);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
